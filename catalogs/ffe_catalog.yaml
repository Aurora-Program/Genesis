# FFE Catalog v2 - Compact Indexed Scheme (Option 1)
# Architecture: 3 (axes) -> 9 (subdimensions) -> 27 (specs); each spec has 8 values (0-7)
# Order enforced: F (Función) -> Fo (Forma) -> E (Estructura)
# Naming Convention:
#  Level 1 Axes: F, Fo, E
#  Level 2 Subdimensions: <Axis><index 0-2>  (e.g. F0, Fo1, E2)
#  Level 3 Specs: <Subdimension>_<index 0-2> (e.g. F0_0, Fo2_1, E1_2)
#  Values: integer keys 0-7 (semantic strings retained from v1 for now)
# Metadata per node: id, level, parent, path, terminal (only specs = true)
# NOTE: Original verbose names removed at dimension/spec level per user request (Option 1). Semantics retained only inside value labels for usability.

